# ============================================================
# CausasPro Bot PJUD - Ejecución MANUAL de respaldo (no programada)
# ⚠️ El bot se usa LOCAL en la PC (bot-100-causas.bat / bot-mantenimiento.bat):
#    el portal PJUD bloquea IPs de nube, por eso los cron automáticos desde
#    GitHub Actions quedaron desactivados (ver BOT-PJUD.md).
# ============================================================

name: 🤖 Bot PJUD - Scraping (solo manual)

# Nunca correr dos scrapers a la vez: el bot escribe en `notas` (contador de intentos,
# marcas [NO EN PORTAL]/[REVISAR]) con un patrón leer-modificar-escribir no atómico. Dos
# corridas solapadas podrían pisarse. cancel-in-progress: false = si ya hay una corriendo,
# la nueva ESPERA (no cancela la que está scrapeando en medio de una causa).
concurrency:
  group: bot-pjud-scraping
  cancel-in-progress: false

on:
  # Solo disparo manual desde GitHub → Actions → "Run workflow".
  # NO tiene schedule (cron): las corridas automáticas en la nube chocaban con el
  # bloqueo de IPs de nube del portal PJUD y gastaban sesiones de Clave Única.
  workflow_dispatch:
    inputs:
      max_causas:
        description: 'Máximo de causas a procesar'
        required: false
        default: '25'
      mode:
        description: 'Modo de ejecución'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - urgent_only
          - test_single

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Max 1 hora por ejecución
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: 📦 Install dependencies
        run: npm install
      
      - name: 🎭 Install Playwright
        run: npx playwright install chromium --with-deps
      
      - name: 🤖 Run Bot
        env:
          PJUD_RUT: ${{ secrets.PJUD_RUT }}
          PJUD_PASSWORD: ${{ secrets.PJUD_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_MAX_CAUSAS: ${{ github.event.inputs.max_causas || '25' }}
          BOT_MODE: ${{ github.event.inputs.mode || 'normal' }}
          SKIP_HOUR_CHECK: '1'
          # Capturas de debug en una carpeta conocida (para subirlas como artifact).
          BOT_SCREENSHOT_DIR: /tmp/bot-capturas
          # En CI NO volcamos el contenido de las tablas (nombres de partes/causas) a los
          # logs públicos de Actions. El diagnóstico detallado queda solo para local.
          BOT_DIAG: '0'
          # El volcado del HTML del detalle (nombres de menores, RUTs, datos de causas de
          # familia) es SOLO para diagnóstico local. Se fuerza a '0' en CI para que ese
          # HTML sensible nunca se escriba dentro del runner, aunque el flag se active.
          BOT_DIAG_DETALLE: '0'
        run: npx tsx src/bot/index.ts
      
      - name: 📸 Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-error-screenshots
          path: /tmp/bot-capturas/*.png
          retention-days: 7
