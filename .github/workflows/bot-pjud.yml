# ============================================================
# CausasPro Bot PJUD - Ejecución automática
# Se ejecuta 2 veces al día (10AM y 4PM hora Chile)
# ============================================================

name: 🤖 Bot PJUD - Scraping automático

on:
  # Cron: 1:30 PM y 2:00 AM hora Chile (UTC-4)
  schedule:
    - cron: '30 17 * * 1-5'  # 1:30 PM Chile, Lunes a Viernes
    - cron: '0 6 * * 1-5'    # 2:00 AM Chile, Lunes a Viernes
  
  # También se puede ejecutar manualmente
  workflow_dispatch:
    inputs:
      max_causas:
        description: 'Máximo de causas a procesar'
        required: false
        default: '25'
      mode:
        description: 'Modo de ejecución'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - urgent_only
          - test_single

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Max 1 hora por ejecución
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🎭 Install Playwright
        run: npx playwright install chromium --with-deps
      
      - name: 🤖 Run Bot
        env:
          PJUD_RUT: ${{ secrets.PJUD_RUT }}
          PJUD_PASSWORD: ${{ secrets.PJUD_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_MAX_CAUSAS: ${{ github.event.inputs.max_causas || '25' }}
          BOT_MODE: ${{ github.event.inputs.mode || 'normal' }}
          SKIP_HOUR_CHECK: '1'
        run: npx tsx src/bot/index.ts
      
      - name: 📸 Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-error-screenshots
          path: /tmp/bot_error_*.png
          retention-days: 7
