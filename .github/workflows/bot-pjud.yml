# ============================================================
# CausasPro Bot PJUD (Nova Act) - Ejecución automática
# ============================================================

name: 🤖 Bot PJUD - Scraping automático

on:
  schedule:
    - cron: '30 13 * * 1-5'  # ~10:00 AM Chile (L-V)
    - cron: '30 19 * * 1-5'  # ~4:00 PM Chile (L-V)

  # También se puede ejecutar manualmente
  workflow_dispatch:
    inputs:
      limite_causas:
        description: 'Máximo de causas a revisar (0 = todas)'
        required: false
        default: '0'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install nova-act pydantic

      - name: 🤖 Run Bot
        env:
          PJUD_RUT: ${{ secrets.PJUD_RUT }}
          PJUD_PASSWORD: ${{ secrets.PJUD_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOVA_ACT_API_KEY: ${{ secrets.NOVA_ACT_API_KEY }}
          LIMITE_CAUSAS: ${{ github.event.inputs.limite_causas || '0' }}
        run: python bot/bot_pjud.py

      - name: 📸 Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-error-screenshots
          path: error_*.png
          retention-days: 7
